[package]
name = "dowe_spawn"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
portable-pty.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3.23.0"

[lib]
path = "src/lib.rs"
