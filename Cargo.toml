[workspace]
members = [
  "crates/agent",
  "crates/agent_harness",
  "crates/cli",
  "crates/codegraph",
  "crates/components",
  "crates/compiler",
  "crates/crypto",
  "crates/deploy",
  "crates/generator_android",
  "crates/generator_desktop",
  "crates/generator_ios",
  "crates/generator_web",
  "crates/id",
  "crates/icons",
  "crates/ipc",
  "crates/cache",
  "crates/queue",
  "crates/minifier",
  "crates/inference",
  "crates/runtime",
  "crates/spawn",
  "crates/stdlib",
  "crates/database",
  "crates/database_query",
  "crates/vector",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "1.0.21"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8.7", features = ["ws"] }
axum-server = "0.8.0"
argon2 = "0.5.3"
bytes = "1.11.0"
candle-core = "0.10"
candle-onnx = "0.10"
aes-gcm = "0.10.3"
aes = "0.8.4"
base64 = "0.22.1"
ctr = "0.9.2"
futures-util = "0.3.31"
hmac = "0.12.1"
libc = "0.2.186"
lapin = "4.10.0"
libloading = "0.9.0"
portable-pty = "0.9.0"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { version = "0.13.3", features = ["blocking", "json", "stream"] }
redis = { version = "1.4.1", default-features = false, features = ["connection-manager", "tokio-rustls-comp"] }
rcgen = "0.13.2"
rustls-acme = { version = "0.15.3", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.8"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.6.10", features = ["compression-br", "compression-gzip"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "webpki-roots"] }
